# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8 -XX:+UseParallelGC -Dsun.io.useCanonCaches=false

# Full JDK location containing javac and jlink tools (Java 21 LTS)
org.gradle.java.home=C:/Users/Prerak Pithadiya/.gradle/jdks/eclipse_adoptium-21-amd64-windows.2

# Disable Gradle Build Cache to prevent Windows file-locking issues
org.gradle.caching=false

# Compile independent modules/tasks in parallel
org.gradle.parallel=false

# Keep Gradle daemon alive; configuration caching disabled for AGP JdkImageInput compatibility
org.gradle.configuration-cache=false

# Kotlin Daemon JVM arguments & Windows File-Locking Optimizations
kotlin.daemon.jvmargs=-Xmx4096m -XX:+UseParallelGC
kotlin.compiler.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
kotlin.incremental=false
kotlin.incremental.useClasspathSnapshot=false
android.disallowKotlinSourceSets=false
android.sync.suppressAgpWarnings=UNSUPPORTED_PROJECT_OPTION_USE
# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
